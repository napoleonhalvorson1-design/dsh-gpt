:40px}.login-box{width:340px;max-width:100%}.lock-mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid #dbe5ca;border-radius:12px;background:#ecf3e1;color:#7a965d;margin-bottom:26px}.lock-mark svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h2{font-size:26px;font-weight:600;letter-spacing:-.7px;margin:0 0 12px}.subtitle{font-size:12px;color:#939f86;line-height:1.9;margin:0 0 32px}label{display:block;font-size:11px;color:#788b66;margin-bottom:10px}.input-wrap{position:relative}input{width:100%;height:46px;border:1px solid #dce3d2;border-radius:7px;background:#fdfefa;padding:0 45px 0 13px;outline:none;font-size:14px;color:#536445}input:focus{border-color:#9bb97a;box-shadow:0 0 0 3px #c9dfac35}.show{position:absolute;right:9px;top:8px;height:30px;background:none;border:0;color:#91a17e;font-size:10px;cursor:pointer}button[type=submit]{height:44px;width:100%;margin-top:20px;border:1px solid #bfdc99;border-radius:7px;background:#cbed90;color:#3a5529;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}button[type=submit]:hover{background:#c1e083}button[type=submit]:disabled{opacity:.6;cursor:wait}.notice{font-size:10px;color:#a4af96;line-height:1.9;display:flex;gap:8px;margin-top:21px}.notice span{color:#90a478}.error{font-size:11px;color:#b07b63;min-height:20px;margin-top:10px;line-height:1.8}.login-footer{font-size:9px;color:#b1bba5;margin-top:45px;border-top:1px solid #e0e7d6;padding-top:19px;display:flex;justify-content:space-between}.badge{font-size:8px;padding:3px 6px;background:#edf2e6;border:1px solid #dfe8d3;border-radius:4px;color:#96a880}@media(max-width:800px){.story{padding:35px;min-height:100dvh}.login-area{padding:30px}.network{height:165px}.card{padding:10px;font-size:10px}.card.c{top:110px}.story h1{color:#e4efd9;font-size:32px}.story-main>p{font-size:11px}}@media(max-width:600px){body{display:block}.story{min-height:auto;padding:25px 26px 35px}.brand{font-size:22px;gap:8px}.brand b{font-size:33px}.story-main{padding:27px 0 0;margin:0}.eyebrow{font-size:8px;letter-spacing:2px}.story h1{color:#e4efd9;font-size:29px;line-height:1.5;margin:13px 0}.story-main>p{font-size:10px;margin-bottom:0}.network,.story-bottom{display:none}.ambient{width:400px;height:400px;right:-250px;bottom:-250px}.login-area{padding:31px 27px 25px;display:block}.login-box{width:100%;max-width:390px;margin:auto}.lock-mark{display:none}h2{font-size:23px;margin-bottom:9px}.subtitle{font-size:11px;margin-bottom:25px}.login-footer{margin-top:26px}.notice{font-size:10px}input{font-size:16px;height:48px}button[type=submit]{height:46px;margin-top:17px}.error{margin-top:7px}}</style></head><body><section class="story"><div class="brand"><b>✳</b>OpenHands.</div><div class="story-main"><span class="eyebrow">人类的灵感 × 智能体的力量</span><h1>连接灵感，<br>一起创造。</h1><p>一个默契的智能体团队，一个无限可能的画布。<br>把你的下一个想法，变成现实。</p><div class="network"><svg viewBox="0 0 380 190"><path d="M130 94C210 94 190 38 260 38M130 94C210 94 190 154 260 154"/></svg><div class="card a"><b>✳</b><div>任务规划师<small>让想法有迹可循</small></div></div><div class="card b"><b>⌘</b><div>研究分析师<small>发现更多可能性</small></div></div><div class="card c"><b>⌥</b><div>开发工程师<small>把好想法写成代码</small></div></div></div></div><span class="story-bottom">为人与智能体的协作而生。</span><div class="ambient"></div></section><main class="login-area"><div class="login-box"><div class="lock-mark"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></div><h2>欢迎回到工作室</h2><p class="subtitle">你的创作空间，已准备就绪。<br>输入访问密码，开启智能体的协作旅程。</p><form id="login-form" method="post" action="/api/login"><label for="password">访问密码</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入访问密码" required maxlength="200"><button class="show" type="button" id="show-password" aria-label="显示密码">显示</button></div><button type="submit" id="submit">进入智能体画布 <span>→</span></button><div class="error" id="error" role="alert"></div></form><div class="notice"><span>♧</span><div>此工作台已启用密码保护。<br>登录状态保留 12 小时，可随时在设置中退出。</div></div><div class="login-footer"><span>OpenHands · 智能体画布</span><span class="badge">受保护的工作空间</span></div></div></main><script>const form=document.getElementById('login-form'),input=document.getElementById('password'),error=document.getElementById('error'),submit=document.getElementById('submit');document.getElementById('show-password').onclick=function(){input.type=input.type==='password'?'text':'password';this.textContent=input.type==='password'?'显示':'隐藏';this.setAttribute('aria-label',input.type==='password'?'显示密码':'隐藏密码')};form.onsubmit=async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='正在验证…';try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});if(res.ok){let next='/';try{const target=new URL(new URLSearchParams(location.search).get('next')||'/',location.origin);if(target.origin===location.origin)next=target.pathname+target.search+target.hash}catch{}location.replace(next);return}const data=await res.json();error.textContent=data.error||'登录失败，请稍后再试。';input.focus()}catch{error.textContent='网络连接失败，请稍后重试。'}finally{submit.disabled=false;submit.innerHTML='进入智能体画布 <span>→</span>'}};</script></body></html>
