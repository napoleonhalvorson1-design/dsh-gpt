server {
 listen 80;
 server_name canvas.43-173-109-57.sslip.io;
 location /.well-known/acme-challenge/ { root /var/www/openhands-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl http2;
 server_name canvas.43-173-109-57.sslip.io;
 ssl_certificate /etc/letsencrypt/live/canvas.43-173-109-57.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/canvas.43-173-109-57.sslip.io/privkey.pem;
 client_max_body_size 2m;
 location / {
  proxy_pass http://127.0.0.1:18120;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 130s;
 }
}
