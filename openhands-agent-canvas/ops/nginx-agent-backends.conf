server {
    listen 80;
    server_name oh-agent.43-173-109-57.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/openhands-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name oh-agent.43-173-109-57.sslip.io;
    ssl_certificate /etc/letsencrypt/live/oh-agent.43-173-109-57.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oh-agent.43-173-109-57.sslip.io/privkey.pem;
    client_max_body_size 130m;
    location /seoul/ {
        proxy_pass http://127.0.0.1:18084/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /silicon/ {
        proxy_pass http://127.0.0.1:18182/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /shanghai/ {
        proxy_pass http://127.0.0.1:18083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /control/ {
        proxy_pass http://127.0.0.1:18110/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
